<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>ChatIA — Mini-Jeux</title>
  <style>
    :root {
      --primary: #3b82f6;
      --secondary: #06b6d4;
      --bg: #0f172a;
      --panel: #1a2332;
      --panel2: #243447;
      --border: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --gold: #93c5fd;
      --btn: #3b82f6;
      --btn-hover: #2563eb;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
    }

    /* ── MENU ── */
    #menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1rem;
      gap: 1.5rem;
    }
    #menu h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
    }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      width: 100%;
      max-width: 480px;
    }
    .gBtn {
      padding: 1rem 0.75rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
      text-align: center;
    }
    .gBtn:hover {
      border-color: var(--primary);
      background: var(--panel2);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
    }
    .gBtn.nav-link {
      background: rgba(59, 130, 246, 0.1);
      border-color: var(--primary);
      color: #93c5fd;
    }
    .gBtn.nav-link.cyan {
      background: rgba(6, 182, 212, 0.1);
      border-color: var(--secondary);
      color: #67e8f9;
    }

    /* ── GAME VIEW ── */
    #game-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 4rem 1rem 2rem;
    }
    #game-view.active { display: flex; }
    .back-btn {
      position: fixed;
      top: 1rem;
      left: 1rem;
      padding: 0.5rem 1rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
      font-size: 0.9rem;
      z-index: 100;
      transition: all 0.15s;
    }
    .back-btn:hover { border-color: var(--primary); color: #93c5fd; }
    #game-content { width: 100%; max-width: 600px; }

    /* ── COMMON GAME STYLES ── */
    .game-title {
      color: var(--gold);
      font-size: 1.4rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    .game-msg {
      text-align: center;
      margin: 0.75rem 0;
      font-size: 1rem;
    }
    .game-btn {
      padding: 0.6rem 1.2rem;
      background: var(--btn);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.15s;
      margin: 0.25rem;
    }
    .game-btn:hover { background: var(--btn-hover); }
    .game-btn.secondary {
      background: var(--panel2);
      border: 1px solid var(--border);
    }
    .game-btn.secondary:hover { border-color: var(--primary); }
    .cell-btn {
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
      font-size: 1.5rem;
      transition: all 0.15s;
    }
    .cell-btn:hover { border-color: var(--primary); background: var(--panel2); }
    input[type="text"], input[type="number"] {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.5rem 0.75rem;
      font-size: 1rem;
      outline: none;
    }
    input[type="text"]:focus, input[type="number"]:focus {
      border-color: var(--primary);
    }
  </style>
</head>
<body>

<!-- ── MENU ── -->
<div id="menu">
  <h1>🎮 Mini-Jeux</h1>
  <div class="games-grid">
    <button class="gBtn" onclick="play(1)">⭕ Morpion</button>
    <button class="gBtn" onclick="play(2)">🔵 Puissance 4</button>
    <button class="gBtn" onclick="play(3)">✌️ Pierre-Papier</button>
    <button class="gBtn" onclick="play(4)">🪤 Pendu</button>
    <button class="gBtn" onclick="play(5)">🔢 2048</button>
    <button class="gBtn" onclick="play(6)">🐍 Snake</button>
    <button class="gBtn" onclick="play(7)">🎵 Simon</button>
    <button class="gBtn" onclick="play(8)">🃏 Mémoire</button>
    <button class="gBtn" onclick="play(9)">🎯 Devin le Nombre</button>
    <button class="gBtn" onclick="play(10)">🪵 Bâtonnets</button>
    <button class="gBtn nav-link" onclick="location.href='home.html'">← Accueil</button>
    <button class="gBtn nav-link cyan" onclick="location.href='index.html'">💬 Aller au Chat</button>
  </div>
</div>

<!-- ── GAME VIEW ── -->
<div id="game-view">
  <button class="back-btn" onclick="backToMenu()">← Retour</button>
  <div id="game-content"></div>
</div>

<script>
const C = document.getElementById('game-content');
const GAMES = {};

function play(n) {
  document.getElementById('menu').style.display = 'none';
  const view = document.getElementById('game-view');
  view.classList.add('active');
  GAMES[n]();
}

function backToMenu() {
  document.getElementById('game-view').classList.remove('active');
  document.getElementById('menu').style.display = 'flex';
  C.innerHTML = '';
}

/* ════════════════════════════════════════
   1. MORPION (TIC-TAC-TOE)
   ════════════════════════════════════════ */
GAMES[1] = function() {
  let b = Array(9).fill(0), p = 1;
  C.innerHTML = `<h3 class="game-title">Morpion (Tic-Tac-Toe)</h3>
    <div id="board" style="display:grid;grid-template-columns:repeat(3,100px);gap:6px;margin:20px auto;width:fit-content"></div>
    <div id="msg" class="game-msg"></div>
    <div style="text-align:center"><button class="game-btn" onclick="GAMES[1]()">Rejouer</button></div>`;

  function render() {
    let h = '';
    for (let i = 0; i < 9; i++) {
      h += `<button class="cell-btn" style="width:100px;height:100px;font-size:2.5rem" onclick="move(${i})">${b[i] ? (b[i] === 1 ? 'X' : 'O') : ''}</button>`;
    }
    document.getElementById('board').innerHTML = h;
  }

  function checkWin() {
    const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    return lines.some(([a,bI,c]) => b[a] && b[a] === b[bI] && b[bI] === b[c]);
  }

  window.move = function(i) {
    if (b[i] || checkWin()) return;
    b[i] = p;
    if (checkWin()) {
      render();
      document.getElementById('msg').innerHTML = `<span style="color:#4ade80;font-weight:bold">Joueur ${p} gagne ! 🎉</span>`;
      return;
    }
    if (b.every(x => x)) { render(); document.getElementById('msg').textContent = 'Match nul !'; return; }
    p = p === 1 ? 2 : 1;
    render();
    document.getElementById('msg').textContent = `Tour du Joueur ${p}`;
  };
  render();
};

/* ════════════════════════════════════════
   2. PUISSANCE 4
   ════════════════════════════════════════ */
GAMES[2] = function() {
  let board = Array(42).fill(0), p = 1;
  C.innerHTML = `<h3 class="game-title">Puissance 4</h3>
    <div id="p4" style="display:grid;grid-template-columns:repeat(7,50px);gap:4px;background:#0a1628;padding:10px;border-radius:10px;margin:10px auto;width:fit-content"></div>
    <div id="msg4" class="game-msg"></div>
    <div style="text-align:center"><button class="game-btn" onclick="GAMES[2]()">Rejouer</button></div>`;

  function render() {
    let h = '';
    for (let i = 0; i < 42; i++) {
      const col = board[i];
      const color = col === 0 ? '#1a2332' : col === 1 ? '#f59e0b' : '#3b82f6';
      h += `<div style="width:50px;height:50px;background:${color};border-radius:50%;cursor:pointer;transition:background 0.15s" onclick="drop(${i%7})"></div>`;
    }
    document.getElementById('p4').innerHTML = h;
  }

  function checkWin(idx) {
    const r = Math.floor(idx/7), col = idx%7;
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    return dirs.some(([dr,dc]) => {
      let count = 1;
      for (let s of [1,-1]) {
        let nr = r + dr*s, nc = col + dc*s;
        while (nr>=0 && nr<6 && nc>=0 && nc<7 && board[nr*7+nc]===p) { count++; nr+=dr*s; nc+=dc*s; }
      }
      return count >= 4;
    });
  }

  window.drop = function(col) {
    for (let r = 5; r >= 0; r--) {
      const i = r*7 + col;
      if (!board[i]) {
        board[i] = p;
        render();
        if (checkWin(i)) {
          document.getElementById('msg4').innerHTML = `<span style="color:#4ade80;font-weight:bold">Joueur ${p} gagne ! 🎉</span>`;
          window.drop = () => {};
          return;
        }
        p = p === 1 ? 2 : 1;
        document.getElementById('msg4').textContent = `Tour du Joueur ${p} ${p===1?'🟡':'🔵'}`;
        return;
      }
    }
  };
  document.getElementById('msg4').textContent = 'Tour du Joueur 1 🟡';
  render();
};

/* ════════════════════════════════════════
   3. PIERRE-PAPIER-CISEAUX
   ════════════════════════════════════════ */
GAMES[3] = function() {
  let p1 = 0, p2 = 0;
  C.innerHTML = `<h3 class="game-title">Pierre-Papier-Ciseaux</h3>
    <div style="display:flex;gap:1rem;justify-content:center;margin:1.5rem 0;flex-wrap:wrap">
      <button class="game-btn" style="font-size:1.5rem;padding:1rem 1.5rem" onclick="ppc(0)">🪨 Pierre</button>
      <button class="game-btn" style="font-size:1.5rem;padding:1rem 1.5rem" onclick="ppc(1)">📄 Papier</button>
      <button class="game-btn" style="font-size:1.5rem;padding:1rem 1.5rem" onclick="ppc(2)">✂️ Ciseaux</button>
    </div>
    <div id="msg3" class="game-msg" style="font-size:1.1rem;min-height:3rem"></div>
    <div id="score3" class="game-msg" style="color:var(--text-muted)">Toi: 0 | IA: 0</div>`;

  const names = ['Pierre','Papier','Ciseaux'];
  window.ppc = function(x) {
    const y = Math.floor(Math.random() * 3);
    let res;
    if (x === y) res = 'Égalité !';
    else if ((x===0&&y===2)||(x===1&&y===0)||(x===2&&y===1)) { res = 'Tu gagnes ! 🎉'; p1++; }
    else { res = 'IA gagne !'; p2++; }
    document.getElementById('msg3').innerHTML = `Toi: <b>${names[x]}</b> | IA: <b>${names[y]}</b><br><span style="color:#4ade80">${res}</span>`;
    document.getElementById('score3').textContent = `Toi: ${p1} | IA: ${p2}`;
  };
};

/* ════════════════════════════════════════
   4. PENDU
   ════════════════════════════════════════ */
GAMES[4] = function() {
  C.innerHTML = `<h3 class="game-title">Pendu</h3>
    <div style="display:flex;gap:0.5rem;align-items:center;justify-content:center;margin:1rem 0;flex-wrap:wrap">
      <input type="text" id="wordInput" placeholder="Mot (sans accents)" maxlength="20" style="width:200px" />
      <button class="game-btn" onclick="startHanging()">Commencer</button>
    </div>
    <div id="hangDisplay" style="font-size:3rem;text-align:center;margin:1rem;color:#f59e0b">0 / 6</div>
    <div id="wordDisplay" style="font-size:2rem;letter-spacing:8px;text-align:center;margin:1rem;font-family:monospace"></div>
    <div id="keyboard" style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:400px;margin:0 auto"></div>
    <div id="msgH" class="game-msg" style="margin-top:1rem"></div>`;

  window.startHanging = function() {
    const w = document.getElementById('wordInput').value.toUpperCase().trim();
    if (!w || /[^A-Z]/.test(w)) { alert('Utilise uniquement des lettres sans accents !'); return; }
    let found = Array(w.length).fill('_'), errors = 0;

    function renderKb() {
      let h = '';
      for (let i = 65; i <= 90; i++) {
        h += `<button id="k${i}" class="game-btn secondary" style="width:36px;height:36px;padding:0;font-size:0.8rem" onclick="guess('${String.fromCharCode(i)}')">${String.fromCharCode(i)}</button>`;
      }
      document.getElementById('keyboard').innerHTML = h;
    }

    window.guess = function(letter) {
      const btn = document.getElementById('k' + letter.charCodeAt(0));
      if (btn) { btn.disabled = true; btn.style.opacity = '0.35'; }
      if (w.includes(letter)) {
        for (let i = 0; i < w.length; i++) if (w[i] === letter) found[i] = letter;
        document.getElementById('wordDisplay').textContent = found.join(' ');
        if (!found.includes('_')) {
          document.getElementById('msgH').innerHTML = '<span style="color:#4ade80;font-weight:bold">🎉 Bravo, tu as trouvé !</span>';
        }
      } else {
        errors++;
        document.getElementById('hangDisplay').textContent = errors + ' / 6';
        if (errors >= 6) {
          document.getElementById('msgH').innerHTML = `<span style="color:#ef4444">💀 Perdu ! Le mot était : <b>${w}</b></span>`;
          document.querySelectorAll('#keyboard button').forEach(b => b.disabled = true);
        }
      }
    };

    document.getElementById('wordDisplay').textContent = found.join(' ');
    document.getElementById('hangDisplay').textContent = '0 / 6';
    document.getElementById('msgH').textContent = '';
    renderKb();
  };
};

/* ════════════════════════════════════════
   5. 2048
   ════════════════════════════════════════ */
GAMES[5] = function() {
  let b = Array(16).fill(0), score = 0;
  C.innerHTML = `<h3 class="game-title">2048</h3>
    <div id="score2048" class="game-msg" style="margin-bottom:0.5rem;font-size:1.1rem">Score: 0</div>
    <div id="board2048" style="display:grid;grid-template-columns:repeat(4,80px);gap:6px;background:#0a1628;padding:10px;border-radius:10px;margin:0 auto;width:fit-content"></div>
    <p style="text-align:center;color:var(--text-muted);font-size:0.8rem;margin-top:0.75rem">Utilise les flèches du clavier</p>
    <div style="text-align:center;margin-top:0.5rem"><button class="game-btn" onclick="GAMES[5]()">Rejouer</button></div>`;

  const tileColors = { 0:'#1a2332', 2:'#2d3e52', 4:'#3f5068', 8:'#1d4ed8', 16:'#2563eb', 32:'#3b82f6', 64:'#0891b2', 128:'#f59e0b', 256:'#d97706', 512:'#dc2626', 1024:'#9333ea', 2048:'#ec4899' };

  function spawn() {
    const empty = b.reduce((a,v,i) => v===0 ? [...a,i] : a, []);
    if (empty.length) b[empty[Math.floor(Math.random()*empty.length)]] = Math.random()<0.9 ? 2 : 4;
  }

  function draw() {
    let h = '';
    for (let i = 0; i < 16; i++) {
      const v = b[i], bg = tileColors[Math.min(v,2048)] || '#581c87';
      h += `<div style="width:80px;height:80px;display:flex;align-items:center;justify-content:center;background:${bg};border-radius:8px;font-size:${v>99?'1.3rem':'1.8rem'};font-weight:bold;color:#fff">${v||''}</div>`;
    }
    document.getElementById('board2048').innerHTML = h;
    document.getElementById('score2048').textContent = 'Score: ' + score;
  }

  function slide(row) {
    let arr = row.filter(x=>x), changed = false;
    for (let i = 0; i < arr.length-1; i++) {
      if (arr[i] === arr[i+1]) { arr[i]*=2; score+=arr[i]; arr.splice(i+1,1); changed=true; }
    }
    while (arr.length < 4) arr.push(0);
    return { arr, changed };
  }

  function move(dir) {
    let moved = false;
    for (let i = 0; i < 4; i++) {
      let row = [];
      if (dir<2) row = b.slice(i*4, i*4+4);
      else row = [0,1,2,3].map(j => b[j*4+i]);
      if (dir===1||dir===3) row.reverse();
      const { arr, changed } = slide(row);
      if (changed) moved = true;
      if (dir===1||dir===3) arr.reverse();
      if (dir<2) for (let j=0;j<4;j++) b[i*4+j]=arr[j];
      else for (let j=0;j<4;j++) b[j*4+i]=arr[j];
    }
    if (moved) { spawn(); draw(); }
  }

  const keyMap = { ArrowUp:0, ArrowDown:1, ArrowLeft:2, ArrowRight:3 };
  function onKey(e) {
    if (e.key in keyMap) { e.preventDefault(); move(keyMap[e.key]); }
  }
  document.addEventListener('keydown', onKey);
  C._cleanup = () => document.removeEventListener('keydown', onKey);

  spawn(); spawn(); draw();
};

/* ════════════════════════════════════════
   6. SNAKE
   ════════════════════════════════════════ */
GAMES[6] = function() {
  C.innerHTML = `<h3 class="game-title">Snake</h3>
    <canvas id="snakeCanvas" width="400" height="400" style="background:#0a1628;border:2px solid #334155;border-radius:8px;display:block;margin:0 auto"></canvas>
    <div id="snakeScore" class="game-msg" style="margin-top:0.5rem">Score: 0</div>
    <p style="text-align:center;color:var(--text-muted);font-size:0.8rem">Utilise les flèches du clavier</p>`;

  const cv = document.getElementById('snakeCanvas');
  const ctx = cv.getContext('2d');
  let sn = [{x:5,y:5}], dir = {x:1,y:0}, food = {x:10,y:10}, snScore = 0, running = true;

  function randomFood() {
    return { x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20) };
  }

  function draw() {
    ctx.fillStyle = '#0a1628';
    ctx.fillRect(0, 0, 400, 400);
    ctx.fillStyle = '#3b82f6';
    sn.forEach(p => ctx.fillRect(p.x*20+1, p.y*20+1, 18, 18));
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(food.x*20+1, food.y*20+1, 18, 18);
  }

  function update() {
    if (!running) return;
    const head = {x: sn[0].x+dir.x, y: sn[0].y+dir.y};
    if (head.x<0||head.x>=20||head.y<0||head.y>=20||sn.some(p=>p.x===head.x&&p.y===head.y)) {
      ctx.fillStyle = 'rgba(239,68,68,0.3)';
      ctx.fillRect(0,0,400,400);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 24px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Game Over! Score: ' + snScore, 200, 200);
      running = false;
      return;
    }
    sn.unshift(head);
    if (head.x===food.x && head.y===food.y) {
      snScore += 10;
      food = randomFood();
      document.getElementById('snakeScore').textContent = 'Score: ' + snScore;
    } else sn.pop();
    draw();
    setTimeout(update, 100);
  }

  function onKey(e) {
    const k = {ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};
    if (k[e.key] && (dir.x !== -k[e.key].x || dir.y !== -k[e.key].y)) {
      e.preventDefault();
      dir = k[e.key];
    }
  }
  document.addEventListener('keydown', onKey);
  C._cleanup = () => { running = false; document.removeEventListener('keydown', onKey); };

  draw();
  update();
};

/* ════════════════════════════════════════
   7. SIMON
   ════════════════════════════════════════ */
GAMES[7] = function() {
  const colors = ['#ef4444','#22c55e','#3b82f6','#eab308'];
  const ids = ['s0','s1','s2','s3'];
  let seq = [], userTurn = false, userIdx = 0, level = 1;

  C.innerHTML = `<h3 class="game-title">Simon</h3>
    <div id="simonGrid" style="display:grid;grid-template-columns:repeat(2,120px);gap:10px;margin:1rem auto;width:fit-content">
      ${colors.map((c,i)=>`<button id="${ids[i]}" style="width:120px;height:120px;background:${c};border:none;border-radius:16px;opacity:0.4;cursor:pointer;transition:opacity 0.15s" onclick="simonPress(${i})"></button>`).join('')}
    </div>
    <div id="simonMsg" class="game-msg">Regarde la séquence…</div>
    <div style="text-align:center"><button class="game-btn" id="simonStart" onclick="simonNext()">Commencer</button></div>`;

  async function flash(i, ms=400) {
    document.getElementById(ids[i]).style.opacity = '1';
    await new Promise(r => setTimeout(r, ms));
    document.getElementById(ids[i]).style.opacity = '0.4';
    await new Promise(r => setTimeout(r, 150));
  }

  async function playSequence() {
    userTurn = false;
    document.getElementById('simonMsg').textContent = 'Regarde la séquence…';
    await new Promise(r => setTimeout(r, 600));
    for (const s of seq) await flash(s);
    userTurn = true;
    userIdx = 0;
    document.getElementById('simonMsg').textContent = `À toi ! (${seq.length} couleur${seq.length>1?'s':''})`;
  }

  window.simonNext = async function() {
    document.getElementById('simonStart').style.display = 'none';
    seq.push(Math.floor(Math.random()*4));
    await playSequence();
  };

  window.simonPress = async function(i) {
    if (!userTurn) return;
    await flash(i, 200);
    if (seq[userIdx] !== i) {
      document.getElementById('simonMsg').innerHTML = `<span style="color:#ef4444">❌ Perdu au niveau ${level} !</span>`;
      document.getElementById('simonStart').textContent = 'Rejouer';
      document.getElementById('simonStart').style.display = '';
      document.getElementById('simonStart').onclick = () => { seq=[]; level=1; simonNext(); };
      userTurn = false;
      return;
    }
    userIdx++;
    if (userIdx === seq.length) {
      level++;
      userTurn = false;
      document.getElementById('simonMsg').textContent = `✅ Niveau ${level} !`;
      await new Promise(r => setTimeout(r, 800));
      await window.simonNext();
    }
  };
};

/* ════════════════════════════════════════
   8. JEU DE MÉMOIRE (MEMORY MATCH)
   ════════════════════════════════════════ */
GAMES[8] = function() {
  const emojis = ['🍎','🍌','🍒','🍓','🍊','🍑','🍋','🍉'];
  let cards = [...emojis,...emojis].sort(() => Math.random()-0.5);
  let revealed = Array(16).fill(false), matched = Array(16).fill(false);
  let flipped = [], pairs = 0, locked = false;

  C.innerHTML = `<h3 class="game-title">Jeu de Mémoire</h3>
    <div id="memGrid" style="display:grid;grid-template-columns:repeat(4,80px);gap:8px;margin:1rem auto;width:fit-content"></div>
    <div id="memScore" class="game-msg">Paires trouvées: 0 / 8</div>`;

  function render() {
    let h = '';
    for (let i = 0; i < 16; i++) {
      const show = revealed[i] || matched[i];
      const bg = matched[i] ? '#166534' : show ? '#2d3e52' : '#1a2332';
      const border = matched[i] ? '2px solid #22c55e' : '2px solid var(--border)';
      h += `<button class="cell-btn" style="width:80px;height:80px;font-size:2rem;background:${bg};border:${border}" onclick="memClick(${i})">${show ? cards[i] : ''}</button>`;
    }
    document.getElementById('memGrid').innerHTML = h;
    document.getElementById('memScore').textContent = `Paires trouvées: ${pairs} / 8`;
  }

  window.memClick = function(i) {
    if (locked || revealed[i] || matched[i] || flipped.includes(i)) return;
    revealed[i] = true;
    flipped.push(i);
    render();
    if (flipped.length === 2) {
      locked = true;
      const [a, bI] = flipped;
      if (cards[a] === cards[bI]) {
        matched[a] = matched[bI] = true;
        pairs++;
        flipped = [];
        locked = false;
        render();
        if (pairs === 8) document.getElementById('memScore').innerHTML = '<span style="color:#4ade80;font-weight:bold">🎉 Bravo, toutes les paires trouvées !</span>';
      } else {
        setTimeout(() => {
          revealed[a] = revealed[bI] = false;
          flipped = [];
          locked = false;
          render();
        }, 900);
      }
    }
  };
  render();
};

/* ════════════════════════════════════════
   9. DEVIN LE NOMBRE
   ════════════════════════════════════════ */
GAMES[9] = function() {
  let secret = Math.floor(Math.random()*100)+1, tries = 0;
  C.innerHTML = `<h3 class="game-title">Devin le Nombre</h3>
    <div style="text-align:center;margin:1.5rem 0">
      <p style="margin-bottom:1rem;color:var(--text-muted)">Je pense à un nombre entre 1 et 100</p>
      <div style="display:flex;gap:0.5rem;justify-content:center;align-items:center;flex-wrap:wrap">
        <input type="number" id="guessInput" min="1" max="100" placeholder="Ton choix…" style="width:130px;text-align:center" />
        <button class="game-btn" onclick="makeGuess()">Deviner</button>
      </div>
      <div id="msg9" class="game-msg" style="margin-top:1rem;font-size:1.1rem;min-height:2rem"></div>
      <div id="tries9" style="color:var(--text-muted);font-size:0.9rem"></div>
    </div>`;

  document.getElementById('guessInput').addEventListener('keydown', e => { if (e.key==='Enter') makeGuess(); });

  window.makeGuess = function() {
    const g = parseInt(document.getElementById('guessInput').value);
    if (!g || g<1 || g>100) return;
    tries++;
    document.getElementById('tries9').textContent = `Essai ${tries}`;
    if (g === secret) {
      document.getElementById('msg9').innerHTML = `<span style="color:#4ade80;font-weight:bold">🎉 Bravo ! Trouvé en ${tries} essai${tries>1?'s':''} !</span>`;
      document.getElementById('guessInput').disabled = true;
    } else {
      document.getElementById('msg9').innerHTML = g < secret
        ? '<span style="color:#f59e0b">📈 Trop petit !</span>'
        : '<span style="color:#f59e0b">📉 Trop grand !</span>';
    }
    document.getElementById('guessInput').value = '';
  };
};

/* ════════════════════════════════════════
   10. BÂTONNETS (NIM)
   ════════════════════════════════════════ */
GAMES[10] = function() {
  let sticks = 21, turn = 1;
  C.innerHTML = `<h3 class="game-title">Bâtonnets (Nim)</h3>
    <div style="text-align:center;margin:1.5rem 0">
      <div id="stickDisplay" style="font-size:2rem;margin:1rem;letter-spacing:3px;color:#f59e0b"></div>
      <div id="nimTurn" class="game-msg" style="margin-bottom:1rem"></div>
      <div style="display:flex;gap:0.5rem;justify-content:center;flex-wrap:wrap">
        <button class="game-btn" onclick="nimTake(1)">Prendre 1</button>
        <button class="game-btn" onclick="nimTake(2)">Prendre 2</button>
        <button class="game-btn" onclick="nimTake(3)">Prendre 3</button>
      </div>
      <div id="nimMsg" class="game-msg" style="margin-top:1rem;font-size:1.1rem"></div>
    </div>`;

  function render() {
    document.getElementById('stickDisplay').textContent = '|'.repeat(sticks) + ` (${sticks})`;
    document.getElementById('nimTurn').textContent = turn === 1 ? '🧑 Ton tour' : '🤖 Tour de l\'IA';
  }

  window.nimTake = function(x) {
    if (turn !== 1) return;
    sticks -= x;
    if (sticks <= 0) {
      sticks = 0;
      render();
      document.getElementById('nimMsg').innerHTML = '<span style="color:#ef4444;font-weight:bold">Tu as pris le dernier bâtonnet. Tu perds !</span>';
      window.nimTake = () => {};
      return;
    }
    turn = 2;
    render();
    setTimeout(() => {
      const ai = sticks % 4 || 1;
      sticks -= ai;
      if (sticks <= 0) {
        sticks = 0;
        render();
        document.getElementById('nimMsg').innerHTML = '<span style="color:#4ade80;font-weight:bold">🎉 L\'IA a pris le dernier bâtonnet. Tu gagnes !</span>';
        window.nimTake = () => {};
        return;
      }
      turn = 1;
      render();
    }, 700);
  };
  render();
};

/* ── Cleanup event listeners when leaving a game ── */
const origBack = window.backToMenu;
window.backToMenu = function() {
  if (C._cleanup) { C._cleanup(); delete C._cleanup; }
  origBack();
};
</script>
