server {
    listen ${PORT};
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for text assets
    gzip on;
    gzip_types text/css application/javascript text/html application/json;
    gzip_min_length 1024;
    gzip_vary on;

    # JS and CSS: cache 1 day (content is versioned by filename)
    location ~* \.(js|css)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # HTML pages: never cache (ensures users always get latest version)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store";
    }

    # Serve any file directly; return 404 for missing paths
    location / {
        try_files $uri $uri/ =404;
    }
}
